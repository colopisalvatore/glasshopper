name: Publish release assets

# Two assets:
#  - the free template zips (aria/grid/pulse) on the moving `templates-latest`
#    release, which the Manager catalog installs 1-click;
#  - `glasshopper.zip` on the version tag's own release, which is what a user
#    without HACS downloads to install the integration by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # gen-readme.mjs imports esbuild (a vite dep) to strip types from slots.ts,
      # so the root deps must be installed before packaging the templates.
      - name: Install root deps
        run: npm ci

      - name: Build + zip free templates
        run: node scripts/package-templates.mjs

      - name: Upload to the templates-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view templates-latest >/dev/null 2>&1 || \
            gh release create templates-latest \
              --title "Template downloads" \
              --notes "Free template zips for the Glasshopper Manager catalog. Auto-updated by CI." \
              --prerelease
          gh release upload templates-latest templates_dist/*.zip --clobber

  integration:
    name: Integration zip (manual install)
    # Only on a version tag: the asset is pinned to that release, and
    # docs link users to /releases/latest to find it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifest version must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json,pathlib;print(json.loads(pathlib.Path('custom_components/glasshopper/manifest.json').read_text())['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest — bump the manifest before tagging."
            exit 1
          fi

      - name: Zip the integration
        # The zip carries the folder itself, so a manual install is just
        # "unzip, drop glasshopper/ into custom_components/".
        run: cd custom_components && zip -r ../glasshopper.zip glasshopper -x '*/__pycache__/*'

      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" glasshopper.zip --clobber
